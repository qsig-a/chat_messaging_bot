# Portainer stack for the SignalWire <-> Discord SMS bridge.
#
# Portainer's stack editor can't build from a Dockerfile, so this pulls a
# pre-built image from GHCR — published by .github/workflows/publish-image.yml
# every time a release is cut. Paste this file into
# Portainer > Stacks > Add stack > Web editor.
#
# Fill every value below in Portainer's "Environment variables" panel — do NOT
# hard-code secrets in the file. Names here match that panel exactly.
#
# IMAGE_REF is the image to run, e.g.
#   ghcr.io/<owner>/<repo>:latest     track the newest release
#   ghcr.io/<owner>/<repo>:v0.1.0     pin, and upgrade deliberately
#
# If the repo is private the package is too: add the registry under
# Portainer > Registries > Custom registry (ghcr.io, your GitHub username, and
# a PAT with read:packages) before the pull will succeed.

services:
  bridge:
    image: ${IMAGE_REF}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_INBOX_CHANNEL_ID: ${DISCORD_INBOX_CHANNEL_ID}
      DISCORD_CATEGORY_ID: ${DISCORD_CATEGORY_ID:-}
      DISCORD_SECURE_CHANNEL_ID: ${DISCORD_SECURE_CHANNEL_ID:-}
      SIGNALWIRE_SPACE_URL: ${SIGNALWIRE_SPACE_URL}
      SIGNALWIRE_PROJECT_ID: ${SIGNALWIRE_PROJECT_ID}
      SIGNALWIRE_API_TOKEN: ${SIGNALWIRE_API_TOKEN}
      SIGNALWIRE_NUMBER: ${SIGNALWIRE_NUMBER}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      VERIFY_SIGNATURE: ${VERIFY_SIGNATURE:-true}
      REDACT_CODES: ${REDACT_CODES:-true}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      # Fixed for the container — leave these as-is.
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8080"
      DB_PATH: /data/bridge.sqlite3
    volumes:
      - bridge-data:/data
    networks:
      - smsnet
    # No ports published on purpose: the webhook is reachable only by
    # cloudflared on this network, never from the host's LAN interface.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - bridge
    networks:
      - smsnet
    # In Cloudflare Zero Trust, point the tunnel's public hostname
    # (e.g. sms.example.com) at  http://bridge:8080

networks:
  smsnet:
    driver: bridge

volumes:
  bridge-data:
